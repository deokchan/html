<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재생목록 셀렉트 박스 플레이어</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 0; padding: 24px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .video iframe, .video #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  select { width: 100%; margin-top: 12px; padding: 10px; font-size: 1rem; }
  #msg { color: #c62828; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="video"><div id="player"></div></div>
  <select id="playlistSelect" aria-label="재생목록" disabled>
    <option>목록 불러오는 중…</option>
  </select>
  <p id="msg"></p>
</div>

<script>
  // ▼ 본인 값으로 교체
  const API_KEY = 'AIzaSyBuKlh-kZ6_WqKdU4OELIdg95c7-Qnkx5w';
  const PLAYLIST_ID = 'PL7xRxNWQmJdeqYzM2yEZstH5KGUQIZ9zS';
  const MAX_TITLE_LEN = 20;   // 제목 최대 표시 글자 수

  let player;
  let videoIds = [];          // 재생 순서대로의 영상 ID 배열

  // 1) 재생목록 가져오기 (영상 ID + 제목)
  async function fetchPlaylistItems(playlistId) {
    const items = [];
    let pageToken = '';
    do {
      const params = new URLSearchParams({
        part: 'snippet,contentDetails',
        playlistId: playlistId,
        maxResults: '50',
        key: API_KEY,
      });
      if (pageToken) params.set('pageToken', pageToken);

      const res = await fetch('https://www.googleapis.com/youtube/v3/playlistItems?' + params);
      const data = await res.json();
      if (!res.ok) {
        const err = data.error || {};
        throw new Error('HTTP ' + res.status + '\n' + (err.message || ''));
      }
      items.push(...data.items);
      pageToken = data.nextPageToken || '';
    } while (pageToken);

    // 삭제/비공개 영상 제외
    return items
      .filter(function (it) {
        return it.snippet.title !== 'Deleted video' && it.snippet.title !== 'Private video';
      })
      .map(function (it) {
        return { id: it.contentDetails.videoId, title: it.snippet.title };
      });
  }

  // 2) 제목 길이 제한 (한글/이모지도 안전하게 글자 단위로 자름)
  function truncate(text, max) {
    const chars = Array.from(text);
    return chars.length > max ? chars.slice(0, max).join('') + '…' : text;
  }

  // 3) 셀렉트 박스 생성: "번호. 제목"
  function buildSelect(items) {
    const select = document.getElementById('playlistSelect');
    select.innerHTML = '';
    items.forEach(function (item, i) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = (i + 1) + '. ' + truncate(item.title, MAX_TITLE_LEN);
      opt.title = item.title; // 마우스를 올리면 전체 제목 표시
      select.append(opt);
    });
    select.disabled = false;

    // 4) 선택한 번호부터 다시 재생
    select.addEventListener('change', function () {
      player.loadPlaylist(videoIds, Number(select.value));
    });
  }

  // 5) 재생 중인 영상이 바뀌면 셀렉트 박스도 맞춰서 변경
  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      const idx = player.getPlaylistIndex();
      if (idx >= 0) document.getElementById('playlistSelect').selectedIndex = idx;
    }
  }

  // 6) 플레이어 준비되면 목록을 불러와 연결
  async function onPlayerReady() {
    try {
      const items = await fetchPlaylistItems(PLAYLIST_ID);
      videoIds = items.map(function (it) { return it.id; });
      buildSelect(items);
      player.cuePlaylist(videoIds, 0); // 자동재생 없이 첫 영상 준비
    } catch (e) {
      document.getElementById('msg').textContent = '목록을 불러오지 못했습니다.\n' + e.message;
    }
  }

  // YouTube IFrame API가 로드되면 자동 호출되는 전역 함수
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
      },
    });
  }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
